services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/sih_procurement
      JWT_SECRET: change_this_in_real_deployment
      JWT_EXPIRES_IN: 1d
      UPLOAD_DIR: /app/uploads
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      - mongo
    volumes:
      - ./uploads:/app/uploads

volumes:
  mongo_data:
